<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-app-region: drag;
    }

    /* Glassmorphism card */
    .glass {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%), #1e1e1e;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      overflow: hidden;
    }

    /* Animated gradient orbs behind the glass */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      z-index: -1;
    }
    .orb-1 {
      width: 200px;
      height: 200px;
      background: #4a9eff;
      top: -60px;
      left: -40px;
      animation: orb-drift-1 4s ease-in-out infinite;
    }
    .orb-2 {
      width: 160px;
      height: 160px;
      background: #a78bfa;
      bottom: -40px;
      right: -30px;
      animation: orb-drift-2 5s ease-in-out infinite;
    }
    .orb-3 {
      width: 120px;
      height: 120px;
      background: #34d399;
      bottom: 20px;
      left: -20px;
      animation: orb-drift-3 3.5s ease-in-out infinite;
    }
    @keyframes orb-drift-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 20px) scale(1.1); }
    }
    @keyframes orb-drift-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-20px, -30px) scale(1.15); }
    }
    @keyframes orb-drift-3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(20px, -15px) scale(1.2); opacity: 0.6; }
    }

    /* Refraction highlight that sweeps across the glass */
    .glass::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        105deg,
        transparent 40%,
        rgba(255,255,255,0.06) 45%,
        rgba(255,255,255,0.12) 50%,
        rgba(255,255,255,0.06) 55%,
        transparent 60%
      );
      animation: refraction 3s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes refraction {
      0% { transform: translateX(-30%) translateY(-10%) rotate(25deg); }
      100% { transform: translateX(30%) translateY(10%) rotate(25deg); }
    }

    /* Icon — frosted inner ring */
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: icon-breathe 3s ease-in-out infinite;
    }
    .icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: conic-gradient(from 0deg, transparent 0%, #4a9eff44 25%, transparent 50%, #a78bfa44 75%, transparent 100%) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ring-spin 4s linear infinite;
    }
    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes icon-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .icon svg {
      width: 28px;
      height: 28px;
      stroke: rgba(255,255,255,0.85);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Title */
    .title {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 0 30px rgba(74,158,255,0.3);
    }

    /* Glass loading track */
    .loader {
      width: 120px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
    }
    .loader-bar {
      position: absolute;
      height: 100%;
      width: 35%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      animation: loader-slide 1.4s ease-in-out infinite;
    }
    @keyframes loader-slide {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    /* Subtle noise texture */
    .glass::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* Morph transitions */
    body { transition: background 0.5s ease-out; }
    .glass { transition: border-radius 0.5s ease-out, border-color 0.3s ease-out, box-shadow 0.3s ease-out; }
    .orb, .icon, .title, .loader { transition: opacity 0.3s ease-out; }
    .glass::before, .glass::after { transition: opacity 0.3s ease-out; }

    /* Morph to app window */
    body.morph { background: #1e1e1e; }
    body.morph .glass {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      border-radius: 10px;
      border-color: transparent;
      box-shadow: none;
      background: #1e1e1e;
    }
    body.morph .orb { animation: none; opacity: 0; }
    body.morph .icon,
    body.morph .title,
    body.morph .loader { opacity: 0; }
    body.morph .glass::before,
    body.morph .glass::after { opacity: 0; }
  </style>
</head>
<body>
  <div class="glass">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="icon"></div>
    <div class="title">Braska</div>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
</body>
</html>
