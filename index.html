<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>The Agency</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header h2 {
      margin: 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }
    #add-project-btn {
      background: none;
      border: 1px solid #444;
      color: #ccc;
      font-size: 1.1rem;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #add-project-btn:hover {
      background: #2a2a2a;
      color: #fff;
      border-color: #666;
    }
    #project-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .project-item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      gap: 8px;
    }
    .project-item:hover {
      background: #252525;
    }
    .project-item.selected {
      background: #2a2a2a;
    }
    .project-name {
      flex: 1;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .project-path {
      font-size: 0.7rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .project-info {
      flex: 1;
      min-width: 0;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      flex-shrink: 0;
    }
    .project-item:hover .remove-btn {
      opacity: 1;
    }
    .remove-btn:hover {
      color: #e55;
      background: #2a1515;
    }
    #empty-sidebar {
      padding: 16px;
      color: #555;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 24px;
    }

    /* Main content */
    #main {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Projects</h2>
      <button id="add-project-btn" title="Add project folder">+</button>
    </div>
    <div id="project-list"></div>
  </div>
  <div id="main">
    <h1>The Agency</h1>
    <p id="info"></p>
  </div>

  <script>
    const info = document.getElementById('info');
    info.innerText = `Electron ${window.versions.electron()} | Chrome ${window.versions.chrome()} | Node ${window.versions.node()}`;

    const projectList = document.getElementById('project-list');
    const addBtn = document.getElementById('add-project-btn');

    function renderProjects(projects) {
      if (projects.length === 0) {
        projectList.innerHTML = '<div id="empty-sidebar">No projects yet.<br>Click + to add a folder.</div>';
        return;
      }
      projectList.innerHTML = projects.map(p => `
        <div class="project-item" data-path="${p.path.replace(/"/g, '&quot;')}">
          <div class="project-info">
            <div class="project-name">${p.name}</div>
            <div class="project-path">${p.path}</div>
          </div>
          <button class="remove-btn" title="Remove project">&times;</button>
        </div>
      `).join('');
    }

    async function loadProjects() {
      const projects = await window.projects.list();
      renderProjects(projects);
    }

    addBtn.addEventListener('click', async () => {
      const result = await window.projects.add();
      if (result) loadProjects();
    });

    projectList.addEventListener('click', async (e) => {
      const removeBtn = e.target.closest('.remove-btn');
      if (removeBtn) {
        const item = removeBtn.closest('.project-item');
        const projectPath = item.dataset.path;
        const projects = await window.projects.remove(projectPath);
        renderProjects(projects);
      }
    });

    loadProjects();
  </script>
</body>
</html>
